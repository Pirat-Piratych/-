<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ООО «МирнГорТранс» • Управление персоналом</title>
  <link rel="stylesheet" href="Общие стили.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Шапка -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">🚌</div>
        <div class="logo-text">ООО<span> «МирнГорТранс»</span></div>
      </div>
      <nav class="nav-links">
        <a href="index.html">О нас</a>
        <a href="Заработные платы.html">Зарплаты</a>
        <a href="Маршруты.html">Маршруты</a>
        <a href="Выходы на маршруты.html" id="lineMenuLink" style="display: none;">Выход на маршруты</a>
        <a href="admin.html" id="adminMenuLink" style="display: none;">Управление</a>
        <span id="authArea"></span>
      </nav>
    </header>

    <!-- Основной контент -->
    <main>
      <section class="page">
        <h2>👥 Управление персоналом</h2>
        
        <!-- Сообщение если нет прав -->
        <div id="noAccessMessage" style="display: none;">
          <p style="color: #b91c1c; font-size: 1.2rem;">⚠ Доступ запрещён.</p>
          <p>Только администратор или заместитель директора могут просматривать эту страницу.</p>
        </div>

        <!-- Панель управления -->
        <div id="adminContent" style="display: none;">
          
          <!-- Форма создания сотрудника -->
          <div class="admin-panel">
            <h3>➕ Создать аккаунт сотрудника</h3>
            
            <div id="formMessage"></div>
            
            <div class="form-group">
              <label for="fullName">NickName:</label>
              <input type="text" id="fullName" placeholder="Name_Surname" required>
            </div>
            
            <div class="form-group">
              <label for="username">Логин:</label>
              <input type="text" id="username" placeholder="ivanov" required>
            </div>
            
            <div class="form-group">
              <label for="password">Пароль:</label>
              <input type="text" id="password" placeholder="Минимум 4 символа" required>
            </div>
            
            <div class="form-group">
              <label for="role">Должность:</label>
              <select id="role" required>
                <option value="">Выберите должность</option>
              </select>
            </div>
            
            <button id="createEmployeeBtn" class="btn-primary">Создать сотрудника</button>
          </div>

          <!-- Таблица сотрудников -->
          <div class="employees-table">
            <h3>📋 Список сотрудников</h3>
            <table id="employeesTable">
              <thead>
                <tr>
                  <th>NickName</th>
                  <th>Логин</th>
                  <th>Должность</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody id="employeesTableBody">
                <tr>
                  <td colspan="5" style="text-align: center;">Загрузка...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="Общая логика.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initAuth();
      updateLineMenuVisibility();
      updateAdminMenuVisibility();
      checkAccessAndInit();
    });
  
    function checkAccessAndInit() {
      const user = getCurrentUser();
      const noAccessMessage = document.getElementById('noAccessMessage');
      const adminContent = document.getElementById('adminContent');
  
      if (!user) {
        noAccessMessage.style.display = 'block';
        adminContent.style.display = 'none';
        return;
      }
  
      if (user.role !== 'admin' && user.role !== 'gendirector') {
        noAccessMessage.style.display = 'block';
        adminContent.style.display = 'none';
        return;
      }
  
      noAccessMessage.style.display = 'none';
      adminContent.style.display = 'block';
      
      populateRoleSelect(user.role);
      loadEmployeesList();
      
      document.getElementById('createEmployeeBtn').addEventListener('click', function() {
        createEmployee();
      });
    }
  
    function populateRoleSelect(currentUserRole) {
      const roleSelect = document.getElementById('role');
      const creatableRoles = getCreatableRoles(currentUserRole);
      
      roleSelect.innerHTML = '<option value="">Выберите должность</option>';
      creatableRoles.forEach(function(role) {
        const option = document.createElement('option');
        option.value = role.value;
        option.textContent = role.name;
        roleSelect.appendChild(option);
      });
    }
  
    async function createEmployee() {
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = document.getElementById('role').value;
      const formMessage = document.getElementById('formMessage');
  
      if (!fullName || !username || !password || !role) {
        formMessage.innerHTML = '<div class="error-message">❌ Заполните все поля</div>';
        return;
      }
  
      if (password.length < 4) {
        formMessage.innerHTML = '<div class="error-message">❌ Пароль должен быть не менее 4 символов</div>';
        return;
      }
  
      const currentUser = getCurrentUser();
      if (!canCreateRole(currentUser.role, role)) {
        formMessage.innerHTML = '<div class="error-message">❌ У вас нет прав на создание этой должности</div>';
        return;
      }
  
      // Firebase: проверка уникальности логина
      const snapshot = await database.ref('users').once('value');
      const users = snapshot.val() || [];
      
      if (users.find(u => u.username === username)) {
        formMessage.innerHTML = '<div class="error-message">❌ Сотрудник с таким логином уже существует</div>';
        return;
      }
  
      // Firebase: создаём сотрудника
      const newEmployee = {
        username, password, name: fullName, role,
        createdAt: getMoscowDateString()
      };
  
      users.push(newEmployee);
      await database.ref('users').set(users);
  
      document.getElementById('fullName').value = '';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('role').value = '';
  
      formMessage.innerHTML = '<div class="success-message">✅ Сотрудник успешно создан!</div>';
      loadEmployeesList();
    }
  
    async function loadEmployeesList() {
      const snapshot = await database.ref('users').once('value');
      const users = snapshot.val() || [];
      const tbody = document.getElementById('employeesTableBody');
      const currentUser = getCurrentUser();
      
      let employees;
      if (currentUser.role === 'admin') {
        employees = users.filter(u => u.role !== 'admin');
      } else {
        const creatableRoles = ROLE_HIERARCHY[currentUser.role] || [];
        employees = users.filter(u => creatableRoles.includes(u.role) || u.role === currentUser.role);
      }
  
      if (employees.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Нет созданных сотрудников</td></tr>';
        return;
      }
  
      tbody.innerHTML = employees.map(function(emp) {
        return `
          <tr>
            <td>${emp.name}</td>
            <td>${emp.username}</td>
            <td>${ROLE_NAMES[emp.role] || emp.role}</td>
            <td>
              <button class="btn-danger" onclick="deleteEmployee('${emp.username}')">Удалить</button>
            </td>
          </tr>
        `;
      }).join('');
    }
  
    window.deleteEmployee = async function(username) {
      const currentUser = getCurrentUser();
      const snapshot = await database.ref('users').once('value');
      const users = snapshot.val() || [];
      const targetUser = users.find(u => u.username === username);
      
      if (!targetUser) return;
      
      if (!canCreateRole(currentUser.role, targetUser.role) && currentUser.role !== targetUser.role) {
        alert('❌ У вас нет прав на удаление этого сотрудника.');
        return;
      }
      
      if (currentUser.username === username) {
        alert('❌ Вы не можете удалить свой аккаунт.');
        return;
      }
      
      if (!confirm(`Вы уверены, что хотите удалить сотрудника ${targetUser.name}?`)) return;
  
      const updatedUsers = users.filter(u => u.username !== username);
      await database.ref('users').set(updatedUsers);
      loadEmployeesList();
    };
  </script>
</body>
</html>
